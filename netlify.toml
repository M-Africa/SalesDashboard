[build]
  publish = "."
  functions = "netlify/functions"

# Never let browsers or CDN cache the dashboard page — every visit gets the latest deploy
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
